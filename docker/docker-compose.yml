version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: livestock_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: livestock_surveillance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d livestock_surveillance"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: livestock_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword2026@postgres:5432/livestock_surveillance
      JWT_ACCESS_SECRET: dev_secret_access_token_super_secure_key_2026!
      JWT_REFRESH_SECRET: dev_secret_refresh_token_super_secure_key_2026!
      ML_SERVICE_URL: http://ml-service:8000
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"

  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    container_name: livestock_ml_service
    restart: unless-stopped
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: livestock_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
